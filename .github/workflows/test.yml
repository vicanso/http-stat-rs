name: "publish"
on:
  push:
    # tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  CARGO_TERM_COLOR: always
  # Keep in sync with publish.yml: the release builds below use the same
  # toolchain and musl image.
  RUST_TOOLCHAIN: 1.98.1

jobs:
  linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        toolchain: [1.89.0, stable]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake libclang-dev wget gnupg ca-certificates lsb-release --no-install-recommends
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - name: Run cargo clippy
        if: matrix.toolchain == 'stable'
        run: |
          cargo install typos-cli
          make lint
      - name: Run cargo machete
        run: |
          cargo install cargo-machete@0.7.0
          cargo machete
      - name: Run cargo test
        run: make test
      - name: Run cargo test without default features
        if: matrix.toolchain == 'stable'
        run: cargo test --no-default-features
      - name: Run cargo msrv
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-msrv --version 0.18.4
          cargo msrv list
      # - name: Run cargo cov
      #   run: |
      #     cargo install cargo-llvm-cov
      #     cargo llvm-cov
      - name: Run cargo release
        run: |
          make release
          ldd target/release/httpstat
      - name: Run upx
        run: |
          ls -lh target/release/httpstat
          curl -L https://github.com/upx/upx/releases/download/v5.0.1/upx-5.0.1-amd64_linux.tar.xz | tar --xz -xvf -
          ./upx-5.0.1-amd64_linux/upx target/release/httpstat
          ls -lh target/release/httpstat

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo test
        run: make test

  # The release builds from publish.yml, so that a tag is not the first time
  # they run.
  macos-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install target
        run: |
          rustup update
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin
      - name: release
        run: |
          cargo build --release --target=aarch64-apple-darwin
          cargo build --release --target=x86_64-apple-darwin
          ls -lh target/*/release/httpstat
          target/aarch64-apple-darwin/release/httpstat --version

  linux-musl:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - name: release
        uses: addnab/docker-run-action@v3
        with:
          image: clux/muslrust:${{ env.RUST_TOOLCHAIN }}-stable
          options: -v ${{ github.workspace }}:/volume
          run: |
            make release
            ls -lh target/${{ matrix.target }}/release/httpstat
            target/${{ matrix.target }}/release/httpstat --version

  windows:
    runs-on: windows-latest
    steps:
      - name: disable git eol translation
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run cargo release
        shell: bash
        run: |
          cargo build --release
          ./target/release/httpstat.exe --version
