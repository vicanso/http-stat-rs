[package]
name = "http-stat"
version = "0.8.0"
authors = ["Tree Xie <tree.xie@outlook.com>"]
edition = "2021"
categories = ["web-programming"]
keywords = ["http", "statistics", "httpstat", "http2", "http3"]
description = "httpstat visualizes curl(1) statistics in a way of beauty and clarity."
license = "MIT"
homepage = "https://github.com/vicanso/http-stat-rs"
repository = "https://github.com/vicanso/http-stat-rs"
exclude = ["Cargo.lock"]
readme = "./README.md"
rust-version = "1.89"
autobins = false

[[bin]]
name = "httpstat"
path = "bin/httpstat.rs"


[features]
default = ["doh"]
# DNS-over-HTTPS and DNS-over-TLS preset support
# (`--dns-servers=cloudflare-doh`, `--dns-servers=cloudflare-dot`, etc.).
# Default-on so the `httpstat` binary ships with full DoH/DoT support;
# library consumers can drop it via `default-features = false`.
# The DoH/DoT exchange is implemented in `src/net.rs`, so this does not
# enable hickory's own TLS/HTTPS transports.
doh = []

[dependencies]
brotli-decompressor = "6.0.1"
bytes = "1.12.1"
bytesize = "2.7.0"
clap = { version = "4.6.7", features = ["derive"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib"] }
futures = "0.3.34"
h3 = "0.0.8"
h3-quinn = "0.0.10"
heck = "0.5.0"
hickory-resolver = { version = "0.26.3", default-features = false, features = [
    "system-config",
    "tokio",
] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
idna = "1.1.0"
libc = "0.2"
hyper-util = { version = "0.1.21", features = ["tokio"] }
nu-ansi-term = "0.50.3"
quinn = { version = "0.11.12", default-features = false, features = [
    "runtime-tokio",
    "rustls",
    "ring",
] }
rustls = { version = "0.23.36", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = "0.8.4"
rustls-pki-types = "1.15.1"
serde_json = "1.0.151"
snafu = "0.9.2"
tempfile = "3.27.0"
time = { version = "0.3.55", default-features = false, features = [
    "std",
    "formatting",
    "parsing",
    "local-offset",
] }
tokio = { version = "1.53.2", features = ["rt", "net", "fs"] }
tokio-rustls = { version = "0.26.6", features = [
    "ring",
], default-features = false }
unicode-truncate = "3.0.0"
x509-parser = "0.18.1"
zstd = { version = "0.14.0", default-features = false }

# mimalloc is only wired in as the global allocator on musl targets
# (see the `#[cfg(target_env = "musl")]` global_allocator in bin/httpstat.rs).
# Keep it out of glibc/macOS builds so it isn't compiled or linked there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = "0.1.52"


# Only the end-to-end tests in `tests/` use these: local servers to point the
# binary at, and a throwaway CA for them.
[dev-dependencies]
hyper = { version = "1.11.1", features = ["server"] }
hyper-util = { version = "0.1.21", features = ["server-auto"] }
rcgen = "0.14.10"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "io-util", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-health = "0.14.6"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
strip = true
panic = "abort"
debug = false
overflow-checks = false
incremental = false

[profile.release.package.brotli-decompressor]
opt-level = 3

[profile.release.package.zstd]
opt-level = 3

[profile.release.package.httparse]
opt-level = 3
